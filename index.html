<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>RISE — Abriendo App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const EXPO_USER = 'testing-v2';
    const EXPO_SLUG = 'greenery-mobile';
    const BRANCH = 'preview';

    const EXPO_DEEP_LINK = `exp://expo.dev/@${EXPO_USER}/${EXPO_SLUG}?release-channel=${BRANCH}`;

    window.addEventListener('DOMContentLoaded', () => {
      window.location.replace(EXPO_DEEP_LINK);
    });
  </script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 flex items-center justify-center p-6">
  <main class="flex flex-col items-center gap-6 text-center max-w-sm">
    <div
      class="h-10 w-10 rounded-full border-2 border-zinc-700 border-t-emerald-400 animate-spin"
      role="status"
      aria-label="Cargando"
    ></div>

    <div class="space-y-2">
      <h1 class="text-lg font-medium tracking-tight text-zinc-100">
        Abriendo RISE en Expo Go...
      </h1>
      <p class="text-sm text-zinc-500">
        Espera un momento. Si no abre automáticamente, asegúrate de tener la app de Expo Go instalada.
      </p>
    </div>
  </main>
</body>
</html>

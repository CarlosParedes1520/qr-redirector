<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>RISE — Abriendo App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Extrae este UUID (36 caracteres) desde app.json → expo.extra.eas.projectId
    const EAS_PROJECT_ID = '8c45131b-609f-4414-8adb-f0f798658968';

    const EXPO_REDIRECT = `exp://u.expo.dev/${EAS_PROJECT_ID}?channel-name=preview`;

    window.addEventListener('DOMContentLoaded', () => {
      window.location.replace(EXPO_REDIRECT);
    });
  </script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 flex items-center justify-center p-6">
  <main class="flex flex-col items-center gap-6 text-center max-w-sm">
    <div
      class="h-10 w-10 rounded-full border-2 border-zinc-700 border-t-emerald-400 animate-spin"
      role="status"
      aria-label="Cargando"
    ></div>

    <div class="space-y-2">
      <h1 class="text-lg font-medium tracking-tight text-zinc-100">
        Abriendo RISE en Expo Go...
      </h1>
      <p class="text-sm text-zinc-500">
        Conectando de forma directa con el canal preview.
      </p>
    </div>
  </main>
</body>
</html>

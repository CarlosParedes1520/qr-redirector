<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>RISE — Lanzando App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // 🚀 Pasamos los headers requeridos como Query Parameters para que EAS no tire Error 400
    // Reemplaza "1.0.0" por tu runtime-version real si la cambiaste en el app.json
    const PROJECT_ID = '60220976-ff00-46a7-a1df-dedced7cfc36';
    const CHANNEL = 'preview';
    const RUNTIME_VERSION = '1.0.0'; 

    const EXPO_REDIRECT = `exp://u.expo.dev/${PROJECT_ID}?channel-name=${CHANNEL}&runtime-version=${RUNTIME_VERSION}`;

    window.addEventListener('DOMContentLoaded', () => {
      window.location.replace(EXPO_REDIRECT);
    });
  </script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 flex items-center justify-center p-6">
  <main class="flex flex-col items-center gap-6 text-center max-w-sm">
    <div
      class="h-10 w-10 rounded-full border-2 border-zinc-700 border-t-emerald-400 animate-spin"
      role="status"
      aria-label="Cargando"
    ></div>

    <div class="space-y-2">
      <h1 class="text-lg font-medium tracking-tight text-zinc-100">
        Abriendo Greenery en Expo Go...
      </h1>
      <p class="text-sm text-zinc-500">
        Sincronizando manifiesto y descargando el avance.
      </p>
    </div>
  </main>
</body>
</html>

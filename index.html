<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>RISE — Lanzando App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // 🚀 ESTA ES LA URL DE MANIFIESTO QUE EXPO GO EXIGE (Formato EAS)
    // Cambiamos 'https' por 'exp' para despertar la app y añadimos el header en el query string
    const EXPO_REDIRECT = 'exp://u.expo.dev/60220976-ff00-46a7-a1df-dedced7cfc36';

    window.addEventListener('DOMContentLoaded', () => {
      window.location.replace(EXPO_REDIRECT);
    });
  </script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 flex items-center justify-center p-6">
  <main class="flex flex-col items-center gap-6 text-center max-w-sm">
    <div
      class="h-10 w-10 rounded-full border-2 border-zinc-700 border-t-emerald-400 animate-spin"
      role="status"
      aria-label="Cargando"
    ></div>

    <div class="space-y-2">
      <h1 class="text-lg font-medium tracking-tight text-zinc-100">
        Abriendo RISE en Expo Go...
      </h1>
      <p class="text-sm text-zinc-500">
        Descargando el último avance de forma directa.
      </p>
    </div>
  </main>
</body>
</html>

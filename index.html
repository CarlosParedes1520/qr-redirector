<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Redirección automática al canal preview de RISE en Expo. Enlace de desarrollo, no indexable.">
  <meta name="robots" content="noindex, nofollow">
  <title>RISE — Redireccionando</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const EXPO_URL = 'https://expo.dev/accounts/testing-v2/projects/greenery-mobile/channels/preview';

    window.addEventListener('DOMContentLoaded', () => {
      window.location.replace(EXPO_URL);
    });
  </script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 flex items-center justify-center p-6">
  <main class="flex flex-col items-center gap-6 text-center max-w-sm">
    <div
      class="h-10 w-10 rounded-full border-2 border-zinc-700 border-t-emerald-400 animate-spin"
      role="status"
      aria-label="Cargando"
    ></div>

    <div class="space-y-2">
      <h1 class="text-lg font-medium tracking-tight text-zinc-100">
        Redireccionando al último avance de RISE...
      </h1>
      <p class="text-sm text-zinc-500">
        Un momento, te estamos llevando a la versión más reciente.
      </p>
    </div>
  </main>
</body>
</html>
